server.port=8084

spring.datasource.url=jdbc:h2:mem:bookdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

#spring.web.resources.add-mappings=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console


spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:/db/migration/V2__initial_data.sql

spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false


# Error responses: no stack traces and no internal details
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Logging: our package on DEBUG so that all levels are visible in the demo (the prod profile will use INFO)
logging.level.com.epam.rd.autocode.spring.project=DEBUG
# SQL in one line, if needed:
#logging.level.org.hibernate.SQL=DEBUG

# Flyway works only in the prod profile; here Hibernate creates the schema and V2 is loaded as the data script
spring.flyway.enabled=false

# JWT in an HttpOnly cookie (web chain only). The secret is for development only, at least 32 bytes
app.jwt.secret=dev-only-jwt-secret-change-me-in-production-0123456789
app.jwt.expiration-minutes=60