<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{orders.pending.title})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3 mb-3" th:text="#{orders.pending.title}">Orders awaiting confirmation</h1>

    <p th:if="${orders.empty}" th:text="#{orders.pending.empty}">There are no orders awaiting confirmation</p>

    <table class="table align-middle" th:unless="${orders.empty}">
        <thead>
        <tr>
            <th>#</th>
            <th th:text="#{orders.date}">Date</th>
            <th th:text="#{orders.client}">Client</th>
            <th th:text="#{orders.items}">Books</th>
            <th th:text="#{orders.total}">Total</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="${o.id}"></td>
            <td th:text="${#temporals.format(o.orderDate, 'dd.MM.yyyy HH:mm')}"></td>
            <td th:text="${o.clientEmail}"></td>
            <td>
                <ul class="list-unstyled mb-0">
                    <li th:each="i : ${o.bookItems}">
                        <span th:text="${i.bookName}"></span>
                        × <span th:text="${i.quantity}"></span>
                        (<span th:text="${#numbers.formatDecimal(i.unitPrice, 1, 2)}"></span>)
                    </li>
                </ul>
            </td>
            <td th:text="${#numbers.formatDecimal(o.price, 1, 2)}"></td>
            <td>
                <form th:action="@{/orders/{id}/confirm(id=${o.id})}" method="post" class="m-0">
                    <button class="btn btn-success btn-sm" type="submit" th:text="#{orders.confirm}">Confirm</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
