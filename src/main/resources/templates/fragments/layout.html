<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-dark px-3">
    <a class="navbar-brand" th:href="@{/books}" th:text="#{app.name}">BookStore</a>
    <ul class="navbar-nav me-auto" sec:authorize="isAuthenticated()">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/books}" th:text="#{nav.books}">Books</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/profile}" th:text="#{nav.profile}">Profile</a>
        </li>
    </ul>
    <div class="ms-auto d-flex align-items-center gap-3 text-white">
        <span><a class="text-white" href="?lang=en">EN</a> | <a class="text-white" href="?lang=uk">UK</a></span>
        <span sec:authorize="isAuthenticated()" sec:authentication="name"></span>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-outline-light btn-sm" type="submit" th:text="#{nav.logout}">Log out</button>
        </form>
    </div>
</nav>
</body>
</html>
