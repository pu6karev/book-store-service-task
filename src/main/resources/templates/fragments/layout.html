<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- A warm-toned search field instead of a bright white one -->
    <style>
        body {
            background-color: #f3e9d2;
            background-image: radial-gradient(circle at center, #fbf6ea 0%, #efe2c4 75%, #decba4 100%);
            color: #2c221e;
            min-height: 100vh;
        }
        .table {
            --bs-table-bg: rgba(250, 244, 230, 0.75);
            --bs-table-striped-bg: rgba(224, 205, 169, 0.45);
            --bs-table-color: #2c221e;
            --bs-table-striped-color: #2c221e;
            --bs-table-border-color: #cbb68e;
        }
        .form-control {
            background-color: #fbf7ed;
            border-color: #cbb68e;
            color: #2c221e;
        }
        .form-control:focus {
            background-color: #fffdf7;
            border-color: #9c7a49;
            color: #2c221e;
            box-shadow: 0 0 0 0.25rem rgba(156, 122, 73, 0.25);
        }
        .table a {
            color: #6b3e1e;
            text-decoration: none;
        }
        .table a:hover {
            color: #3d210d;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-dark px-3">
    <a class="navbar-brand" th:href="@{/books}" th:text="#{app.name}">BookStore</a>
    <ul class="navbar-nav me-auto" sec:authorize="isAuthenticated()">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/books}" th:text="#{nav.books}">Books</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('CLIENT')">
            <a class="nav-link" th:href="@{/cart}" th:text="#{nav.cart}">Cart</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('CLIENT')">
            <a class="nav-link" th:href="@{/orders}" th:text="#{nav.orders}">My orders</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('EMPLOYEE')">
            <a class="nav-link" th:href="@{/orders/pending}" th:text="#{nav.orders.pending}">Pending orders</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('EMPLOYEE')">
            <a class="nav-link" th:href="@{/clients}" th:text="#{nav.clients}">Clients</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/profile}" th:text="#{nav.profile}">Profile</a>
        </li>
    </ul>
    <div class="ms-auto d-flex align-items-center gap-3 text-white">
        <span>
            <a class="text-white" href="#" onclick="switchLang('en'); return false;">EN</a> |
            <a class="text-white" href="#" onclick="switchLang('uk'); return false;">UK</a>
        </span>
        <span sec:authorize="isAuthenticated()" sec:authentication="name"></span>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-outline-light btn-sm" type="submit" th:text="#{nav.logout}">Log out</button>
        </form>
    </div>
    <script>
        // keeps the other query parameters (name, q, sort, page...) when the language is switched
        function switchLang(lang) {
            const url = new URL(window.location.href);
            url.searchParams.set('lang', lang);
            window.location.href = url.toString();
        }
    </script>
</nav>

<div th:fragment="flash">
    <div class="alert alert-success" th:if="${flashSuccess}" th:text="#{${flashSuccess}}"></div>
    <div class="alert alert-danger" th:if="${flashError}" th:text="#{${flashError}}"></div>
</div>
</body>
</html>
