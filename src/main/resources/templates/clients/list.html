<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{clients.title})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3 mb-3" th:text="#{clients.title}">Clients</h1>

    <table class="table align-middle">
        <thead>
        <tr>
            <th th:text="#{clients.name}">Name</th>
            <th th:text="#{clients.email}">Email</th>
            <th th:text="#{clients.balance}">Balance</th>
            <th th:text="#{clients.status}">Status</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clients}">
            <td th:text="${c.name}"></td>
            <td th:text="${c.email}"></td>
            <td th:text="${#numbers.formatDecimal(c.balance, 1, 2)}"></td>
            <td>
                <span class="badge bg-danger" th:if="${c.blocked}" th:text="#{clients.status.blocked}">Blocked</span>
                <span class="badge bg-success" th:unless="${c.blocked}" th:text="#{clients.status.active}">Active</span>
            </td>
            <td>
                <form th:if="${c.blocked}" th:action="@{/clients/unblock}" method="post" class="m-0">
                    <input type="hidden" name="email" th:value="${c.email}">
                    <button class="btn btn-outline-success btn-sm" type="submit" th:text="#{clients.unblock}">Unblock</button>
                </form>
                <form th:unless="${c.blocked}" th:action="@{/clients/block}" method="post" class="m-0">
                    <input type="hidden" name="email" th:value="${c.email}">
                    <button class="btn btn-outline-danger btn-sm" type="submit" th:text="#{clients.block}">Block</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
