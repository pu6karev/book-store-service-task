<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{books.title})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-4">
    <h1 class="h3 mb-3" th:text="#{books.title}">Books</h1>

    <form class="row g-2 mb-3" th:action="@{/books}" method="get">
        <div class="col-auto">
            <input type="text" class="form-control" name="q" th:value="${q}"
                   th:placeholder="#{books.search.placeholder}">
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" type="submit" th:text="#{books.search}">Search</button>
        </div>
    </form>

    <p th:if="${page.empty}" th:text="#{books.empty}">No books found</p>

    <table class="table table-striped" th:unless="${page.empty}">
        <thead>
        <tr>
            <th><span th:text="#{book.name}">Title</span>
                <a th:href="@{/books(q=${q}, sort='name,asc')}">▲</a>
                <a th:href="@{/books(q=${q}, sort='name,desc')}">▼</a></th>
            <th><span th:text="#{book.author}">Author</span>
                <a th:href="@{/books(q=${q}, sort='author,asc')}">▲</a>
                <a th:href="@{/books(q=${q}, sort='author,desc')}">▼</a></th>
            <th th:text="#{book.genre}">Genre</th>
            <th><span th:text="#{book.price}">Price</span>
                <a th:href="@{/books(q=${q}, sort='price,asc')}">▲</a>
                <a th:href="@{/books(q=${q}, sort='price,desc')}">▼</a></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${page.content}">
            <td th:text="${b.name}"></td>
            <td th:text="${b.author}"></td>
            <td th:text="${b.genre}"></td>
            <td th:text="${#numbers.formatDecimal(b.price, 1, 2)}"></td>
        </tr>
        </tbody>
    </table>

    <nav class="d-flex justify-content-between align-items-center" th:if="${page.totalPages > 1}">
        <a class="btn btn-outline-secondary btn-sm"
           th:classappend="${!page.hasPrevious()} ? 'disabled'"
           th:href="@{/books(q=${q}, sort=${sort}, page=${page.number - 1})}"
           th:text="#{books.prev}">Previous</a>
        <span th:text="#{books.page(${page.number + 1}, ${page.totalPages})}">Page 1 of 2</span>
        <a class="btn btn-outline-secondary btn-sm"
           th:classappend="${!page.hasNext()} ? 'disabled'"
           th:href="@{/books(q=${q}, sort=${sort}, page=${page.number + 1})}"
           th:text="#{books.next}">Next</a>
    </nav>
</div>
</body>
</html>
