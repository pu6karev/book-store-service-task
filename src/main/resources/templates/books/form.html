<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{books.title})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-4" style="max-width: 640px;">
    <h1 class="h3 mb-3"
        th:text="${originalName == null} ? #{books.form.add.title} : #{books.form.edit.title}">New book</h1>

    <form th:action="${originalName == null} ? @{/books/add} : @{/books/edit}"
          th:object="${form}" method="post" novalidate>
        <input type="hidden" name="originalName" th:if="${originalName != null}" th:value="${originalName}">

        <div class="mb-3">
            <label class="form-label" for="name" th:text="#{book.name}">Title</label>
            <input type="text" class="form-control" th:field="*{name}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="author" th:text="#{book.author}">Author</label>
            <input type="text" class="form-control" th:field="*{author}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{author}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="genre" th:text="#{book.genre}">Genre</label>
            <select class="form-select" th:field="*{genre}" th:errorclass="is-invalid">
                <option value="">—</option>
                <option th:each="g : ${genres}" th:value="${g}" th:text="${g.displayName}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{genre}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="ageGroup" th:text="#{book.agegroup}">Age group</label>
            <select class="form-select" th:field="*{ageGroup}" th:errorclass="is-invalid">
                <option value="">—</option>
                <option th:each="a : ${ageGroups}" th:value="${a}" th:text="${a}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{ageGroup}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="language" th:text="#{book.language}">Language</label>
            <select class="form-select" th:field="*{language}" th:errorclass="is-invalid">
                <option value="">—</option>
                <option th:each="l : ${languages}" th:value="${l}" th:text="${l}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{language}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="price" th:text="#{book.price}">Price</label>
            <input type="number" step="0.01" class="form-control" th:field="*{price}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{price}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="publicationDate" th:text="#{book.publication}">Publication date</label>
            <input type="date" class="form-control" th:field="*{publicationDate}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{publicationDate}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="pages" th:text="#{book.pages}">Pages</label>
            <input type="number" class="form-control" th:field="*{pages}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{pages}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="characteristics" th:text="#{book.characteristics}">Characteristics</label>
            <input type="text" class="form-control" th:field="*{characteristics}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{characteristics}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="description" th:text="#{book.description}">Description</label>
            <textarea class="form-control" rows="4" th:field="*{description}" th:errorclass="is-invalid"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>

        <button class="btn btn-primary" type="submit" th:text="#{books.save}">Save</button>
        <a class="btn btn-link"
           th:href="${originalName == null} ? @{/books} : @{/books/view(name=${originalName})}"
           th:text="#{books.cancel}">Cancel</a>
    </form>
</div>
</body>
</html>
