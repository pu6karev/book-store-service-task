<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{error.500.title})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-5 text-center">
    <p class="display-1 text-muted mb-0">500</p>
    <h1 class="h3 mb-3" th:text="#{error.500.title}">Something went wrong</h1>
    <p class="text-muted" th:text="#{error.500.text}">An unexpected error occurred. Please try again later.</p>
    <a class="btn btn-primary" th:href="@{/books}" th:text="#{error.back}">Back to books</a>
</div>
</body>
</html>
