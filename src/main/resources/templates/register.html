<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{register.title})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-5" style="max-width: 420px;">
    <h1 class="h3 mb-3" th:text="#{register.title}">Registration</h1>
    <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
        <div class="mb-3">
            <label class="form-label" for="name" th:text="#{register.name}">Name</label>
            <input type="text" class="form-control" th:field="*{name}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="email" th:text="#{register.email}">Email</label>
            <input type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password" th:text="#{register.password}">Password</label>
            <input type="password" class="form-control" th:field="*{password}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{password}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="confirmPassword" th:text="#{register.confirm}">Confirm password</label>
            <input type="password" class="form-control" th:field="*{confirmPassword}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
        </div>
        <button class="btn btn-primary w-100" type="submit" th:text="#{register.submit}">Register</button>
    </form>
    <p class="mt-3">
        <span th:text="#{register.have.account}">Already registered?</span>
        <a th:href="@{/login}" th:text="#{register.login.link}">Sign in</a>
    </p>
</div>
</body>
</html>
