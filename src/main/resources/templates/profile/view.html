<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{nav.profile})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-4" style="max-width: 600px;">
    <h1 class="h3 mb-3"
        th:text="${client != null} ? #{profile.title.client} : #{profile.title.employee}">My profile</h1>
    <div class="alert alert-success" th:if="${param.updated}" th:text="#{profile.updated}"></div>

    <dl class="row" th:if="${client != null}">
        <dt class="col-sm-4" th:text="#{profile.name}">Name</dt>
        <dd class="col-sm-8" th:text="${client.name}"></dd>
        <dt class="col-sm-4" th:text="#{profile.email}">Email</dt>
        <dd class="col-sm-8" th:text="${client.email}"></dd>
        <dt class="col-sm-4" th:text="#{profile.balance}">Balance</dt>
        <dd class="col-sm-8" th:text="${#numbers.formatDecimal(client.balance, 1, 2)}"></dd>
    </dl>

    <dl class="row" th:if="${employee != null}">
        <dt class="col-sm-4" th:text="#{profile.name}">Name</dt>
        <dd class="col-sm-8" th:text="${employee.name}"></dd>
        <dt class="col-sm-4" th:text="#{profile.email}">Email</dt>
        <dd class="col-sm-8" th:text="${employee.email}"></dd>
        <dt class="col-sm-4" th:text="#{profile.phone}">Phone</dt>
        <dd class="col-sm-8" th:text="${employee.phone}"></dd>
        <dt class="col-sm-4" th:text="#{profile.birthdate}">Birth date</dt>
        <dd class="col-sm-8" th:text="${#temporals.format(employee.birthDate, 'dd.MM.yyyy')}"></dd>
    </dl>

    <a class="btn btn-primary" th:href="@{/profile/edit}" th:text="#{profile.edit}">Edit profile</a>
</div>
</body>
</html>
