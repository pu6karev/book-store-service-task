<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(#{profile.edit})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-4" style="max-width: 480px;">
    <h1 class="h3 mb-3" th:text="#{profile.edit}">Edit profile</h1>
    <form th:action="@{/profile/edit}" th:object="${form}" method="post" novalidate>
        <div class="mb-3">
            <label class="form-label" for="name" th:text="#{profile.name}">Name</label>
            <input type="text" id="name" class="form-control" th:field="*{name}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>

        <div sec:authorize="hasRole('EMPLOYEE')">
            <div class="mb-3">
                <label class="form-label" for="phone" th:text="#{profile.phone}">Phone</label>
                <input type="text" id="phone" class="form-control" th:field="*{phone}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{phone}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="birthDate" th:text="#{profile.birthdate}">Birth date</label>
                <input type="date" id="birthDate" class="form-control" th:field="*{birthDate}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{birthDate}"></div>
            </div>
        </div>

        <button class="btn btn-primary" type="submit" th:text="#{profile.save}">Save</button>
        <a class="btn btn-link" th:href="@{/profile}" th:text="#{profile.cancel}">Cancel</a>
    </form>
</div>
</body>
</html>
