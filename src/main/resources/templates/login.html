<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{login.title})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-5" style="max-width: 420px;">
    <h1 class="h3 mb-3" th:text="#{login.title}">Sign in</h1>
    <div class="alert alert-danger" th:if="${param.error}" th:text="#{login.error}"></div>
    <div class="alert alert-danger" th:if="${param.blocked}" th:text="#{login.blocked}"></div>
    <div class="alert alert-info" th:if="${param.logout}" th:text="#{login.logout}"></div>
    <div class="alert alert-success" th:if="${param.registered}" th:text="#{login.registered}"></div>
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label" for="username" th:text="#{login.email}">Email</label>
            <input class="form-control" type="text" id="username" name="username" autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password" th:text="#{login.password}">Password</label>
            <input class="form-control" type="password" id="password" name="password">
        </div>
        <button class="btn btn-primary w-100" type="submit" th:text="#{login.submit}">Sign in</button>
    </form>
    <p class="mt-3">
        <span th:text="#{login.no.account}">No account yet?</span>
        <a th:href="@{/register}" th:text="#{login.register.link}">Register</a>
    </p>
</div>
</body>
</html>
