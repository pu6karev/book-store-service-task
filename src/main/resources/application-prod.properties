# Production profile: file-based H2, the schema and the data are managed by Flyway (db/migration)
spring.datasource.url=jdbc:h2:file:./data/bookstore
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:password}

# Hibernate only checks that the schema matches the entities; Flyway owns the schema
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# V2 is applied by Flyway, so the Spring initializer must not run the data script a second time
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

spring.jpa.show-sql=false

logging.level.com.epam.rd.autocode.spring.project=INFO
logging.file.name=logs/bookstore.log

# JWT secret comes from the JWT_SECRET environment variable; the default is only for the demo
app.jwt.secret=${JWT_SECRET:prod-default-jwt-secret-set-JWT_SECRET-env-variable-0123}